<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}ReconSystem{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    {% block extra_styles %}{% endblock %}
  </style>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-error-container": "#93000a",
            "outline-variant": "#c3c6d7",
            "on-surface-variant": "#434655",
            "on-primary-fixed": "#00174b",
            "on-background": "#191c1d",
            "on-secondary-fixed-variant": "#38485d",
            "secondary-container": "#d0e1fb",
            "primary-fixed": "#dbe1ff",
            "surface-container-highest": "#e1e3e4",
            "on-primary": "#ffffff",
            "surface-dim": "#d9dadb",
            "on-tertiary": "#ffffff",
            "surface-container-high": "#e7e8e9",
            "on-tertiary-fixed": "#360f00",
            "secondary-fixed-dim": "#b7c8e1",
            "tertiary-container": "#bc4800",
            "on-tertiary-fixed-variant": "#7d2d00",
            "on-surface": "#191c1d",
            "on-primary-container": "#eeefff",
            "on-error": "#ffffff",
            "primary-container": "#2563eb",
            "inverse-on-surface": "#f0f1f2",
            "on-secondary-fixed": "#0b1c30",
            "tertiary-fixed": "#ffdbcd",
            "surface": "#f8f9fa",
            "primary-fixed-dim": "#b4c5ff",
            "secondary": "#505f76",
            "surface-variant": "#e1e3e4",
            "error": "#ba1a1a",
            "surface-container": "#edeeef",
            "secondary-fixed": "#d3e4fe",
            "surface-container-low": "#f3f4f5",
            "on-secondary-container": "#54647a",
            "background": "#f8f9fa",
            "surface-tint": "#0053db",
            "inverse-surface": "#2e3132",
            "on-tertiary-container": "#ffede6",
            "primary": "#004ac6",
            "on-secondary": "#ffffff",
            "surface-bright": "#f8f9fa",
            "outline": "#737686",
            "inverse-primary": "#b4c5ff",
            "surface-container-lowest": "#ffffff",
            "error-container": "#ffdad6",
            "tertiary": "#943700",
            "on-primary-fixed-variant": "#003ea8",
            "tertiary-fixed-dim": "#ffb596"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          spacing: {
            "sm": "8px",
            "xl": "32px",
            "md": "16px",
            "lg": "24px",
            "gutter": "16px",
            "base": "8px",
            "xs": "4px",
            "margin": "24px"
          },
          fontFamily: {
            "label-md": ["Inter"],
            "headline-md": ["Inter"],
            "display-sm": ["Inter"],
            "body-md": ["Inter"],
            "headline-sm": ["Inter"],
            "body-sm": ["Inter"],
            "data-mono": ["JetBrains Mono"],
            "title-lg": ["Inter"]
          },
          fontSize: {
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
            "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "display-sm": ["30px", { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "data-mono": ["13px", { lineHeight: "18px", fontWeight: "400" }],
            "title-lg": ["18px", { lineHeight: "28px", fontWeight: "500" }]
          }
        }
      }
    }
  </script>
</head>

<body class="bg-background text-on-background font-body-md min-h-screen antialiased">

  <!-- ── Top Navigation Bar ─────────────────────────────────────────────── -->
  <header class="bg-surface-container-lowest border-b border-outline-variant fixed top-0 w-full z-50 h-[64px] flex items-center">
    <div class="w-full max-w-[1440px] mx-auto px-margin flex justify-between items-center h-full">

      <!-- Brand + Nav Links -->
      <div class="flex items-center gap-lg h-full">
        <a href="/" class="font-title-lg text-title-lg font-bold text-primary flex items-center gap-sm hover:opacity-80 transition-opacity">
          <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">dataset</span>
          ReconSystem
        </a>

        <nav class="hidden md:flex items-center h-full">
          <a href="/dashboard"
             class="h-full flex items-center font-label-md text-label-md px-sm transition-colors
                    {% if active_page == 'dashboard' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            Dashboard
          </a>
          <a href="/upload"
             class="h-full flex items-center font-label-md text-label-md px-sm transition-colors
                    {% if active_page == 'upload' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            Upload
          </a>
          <a href="/organizations"
             class="h-full flex items-center font-label-md text-label-md px-sm transition-colors
                    {% if active_page == 'organizations' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            Organizations
          </a>
          <a href="/uploaded-files"
             class="h-full flex items-center font-label-md text-label-md px-sm transition-colors
                    {% if active_page == 'uploaded_files' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            Uploaded Files
          </a>
        </nav>
      </div>

      <!-- Trailing Actions -->
      <div class="flex items-center gap-sm">
        <div class="relative hidden lg:block">
          <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline text-[18px]">search</span>
          <input class="h-[36px] pl-[32px] pr-sm bg-surface rounded border border-outline-variant
                         font-body-sm text-body-sm text-on-surface w-[200px]
                         focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
                 placeholder="Search..." type="text"/>
        </div>
        <button class="w-[36px] h-[36px] rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
          <span class="material-symbols-outlined text-[20px]">notifications</span>
        </button>
        <button class="w-[36px] h-[36px] rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
          <span class="material-symbols-outlined text-[20px]">settings</span>
        </button>
        <button class="w-[36px] h-[36px] rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
          <span class="material-symbols-outlined text-[20px]">help</span>
        </button>
        <div class="w-[32px] h-[32px] rounded-full bg-primary-container flex items-center justify-center text-on-primary ml-sm">
          <span class="material-symbols-outlined text-[16px]">person</span>
        </div>
      </div>

    </div>
  </header>
  <!-- ── End Top Navigation Bar ─────────────────────────────────────────── -->

  <!-- ── Page Content ───────────────────────────────────────────────────── -->
  <div class="pt-[64px] min-h-screen">
    {% block content %}{% endblock %}
  </div>
  <!-- ── End Page Content ───────────────────────────────────────────────── -->

  {% block scripts %}{% endblock %}

</body>
</html>
